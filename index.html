<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#15803d" />
  <title>(ADCO) شركة الاسكندريه للكيماويات و المنظفات</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/mobile-pwa.css" />
  <style>
    .landing-card {
      background: #ffffff;
      border: 1px solid var(--adco-gray-200);
      border-radius: var(--radius-lg);
      padding: clamp(24px, 4vw, 40px);
      box-shadow: var(--shadow-md);
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }
    .landing-logo-box {
      margin-bottom: 24px;
    }
    .landing-logo-box img {
      width: 190px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="auth-floating-wrapper">
    <!-- Atmospheric Blurred Green Background Backdrop -->
    <div class="auth-floating-bg" aria-hidden="true">
      <img src="./assets/images/auth-hero-bg.webp" alt="" class="auth-floating-bg-img" />
      <div class="auth-floating-bg-overlay"></div>
      <div class="auth-floating-bg-ambient"></div>
    </div>

    <!-- Centered Floating Landing Box -->
    <main class="auth-floating-card landing-card">
      <div class="landing-logo-box" style="text-align: center; margin-bottom: 20px;">
        <img src="./assets/images/ADCO-logo.png" alt="ADCO Logo" style="height: 54px; width: auto; margin: 0 auto 12px; display: block;" />
      </div>

      <div style="text-align: center; margin-bottom: 22px;">
        <span class="badge badge-mint" style="margin-bottom: 12px; display: inline-flex; align-items: center; gap: 6px;">
          <img src="./assets/icons/shield-check.svg" class="ui-icon ui-icon-sm" alt="" />
          <span>منظومة العمليات المؤسسية v2.5</span>
        </span>
        <h1 style="font-size: 1.55rem; font-weight: 800; color: var(--adco-green-deep); margin-bottom: 8px;">منظومة المتابعة والتنسيق الميداني</h1>
        <p style="font-size: 0.9rem; color: var(--adco-gray-600); line-height: 1.6; margin: 0;">
          (ADCO) شركة الاسكندريه للكيماويات و المنظفات — المنصة الرقمية الموحدة لإدارة العمليات الميدانية وتوثيق العروض.
        </p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <a href="./pages/login.html" class="btn btn-primary" id="btn-login-cta" style="padding: 12px 20px; font-size: 1rem; border-radius: var(--radius-md); box-shadow: 0 4px 14px rgba(22, 101, 52, 0.35);">
          <img src="./assets/icons/log-in.svg" class="ui-icon" alt="" />
          <span>تسجيل دخول</span>
        </a>
        <a href="./pages/signup-wizard.html" class="btn btn-secondary" style="padding: 12px 20px; font-size: 1rem; border-radius: var(--radius-md);">
          <img src="./assets/icons/user-plus.svg" class="ui-icon" alt="" />
          <span>تفعيل حساب موظف جديد</span>
        </a>
      </div>
    </main>

    <!-- Centered Atmospheric Footer -->
    <footer class="auth-floating-footer">
      <span>(ADCO) شركة الاسكندريه للكيماويات و المنظفات &copy; 2026</span>
      <span style="opacity: 0.6;">•</span>
      <span>البوابة السحابية الموحدة</span>
    </footer>
  </div>

  <script src="./js/ui-helpers.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/activity-manager.js"></script>
  <script src="./js/app.js"></script>
  <script>
    AppRouter.cleanupLegacyCaches();
    AppRouter.registerServiceWorker();

    const currentUser = AuthManager.getCurrentUser();
    if (currentUser) {
      const card = document.querySelector('.landing-card');
      const resumeBtn = document.createElement('a');
      resumeBtn.href = './pages/dashboard.html';
      resumeBtn.className = 'btn btn-outline';
      resumeBtn.style.marginTop = '12px';
      resumeBtn.innerHTML = `
        <img src="./assets/icons/layout-dashboard.svg" class="ui-icon" alt="" />
        <span>متابعة الجلسة النشطة (${currentUser.fullName})</span>
      `;
      card.appendChild(resumeBtn);
    }
  </script>
</body>
</html>
