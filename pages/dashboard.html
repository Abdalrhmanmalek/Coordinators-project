<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#15803d" />
  <title>لوحة المنسق الميداني | ADCO Field Portal</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/mobile-pwa.css" />
  <style>
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 768px) {
      .kpi-row {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }
    .kpi-card {
      background: #ffffff;
      border: 1px solid var(--adco-gray-200);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-sm);
    }
    .kpi-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: var(--adco-green-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .kpi-num {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--adco-green-deep);
      line-height: 1.1;
    }
    .kpi-title {
      font-size: 0.82rem;
      color: var(--adco-gray-600);
      font-weight: 600;
      margin-top: 2px;
    }
    .activity-card-item {
      display: flex;
      gap: 16px;
      align-items: stretch;
      text-decoration: none;
      color: inherit;
      padding: 16px;
      background: #ffffff;
      border: 1px solid var(--adco-gray-200);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      height: 100%;
      min-height: 122px;
      box-sizing: border-box;
      overflow: hidden;
    }
    .activity-card-item:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--adco-green-border);
      transform: translateY(-2px);
    }
    .activity-card-thumb {
      width: 90px;
      height: 90px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--adco-gray-200);
    }
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .filter-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .filter-chip {
      background: #ffffff;
      border: 1px solid var(--adco-gray-300);
      color: var(--adco-gray-700);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .filter-chip.active {
      background: var(--adco-green-primary);
      color: #ffffff;
      border-color: var(--adco-green-primary);
    }
  </style>
</head>
<body>
  <div id="app-header-mount"></div>

  <main class="web-main-workspace">
    <!-- Top Welcome & Quick Actions -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
      <div>
        <h1 id="welcome-title" style="margin-bottom: 4px;">لوحة المتابعة الميدانية</h1>
        <p id="welcome-role">استعراض الأنشطة الترويجية ومتابعة تقييمات الجودة المعتمدة</p>
      </div>
      <a href="./activity-card.html" class="btn btn-primary">
        <img src="../assets/icons/plus-circle.svg" class="ui-icon" alt="" />
        <span>تسجيل نشاط جديد</span>
      </a>
    </div>

    <!-- KPI Row -->
    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-icon-wrap">
          <img src="../assets/icons/layout-dashboard.svg" class="ui-icon ui-icon-lg" alt="" />
        </div>
        <div>
          <div class="kpi-num" id="kpi-total">0</div>
          <div class="kpi-title">إجمالي الأنشطة المسجلة</div>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon-wrap" style="background: #dcfce7;">
          <img src="../assets/icons/check-circle-2.svg" class="ui-icon ui-icon-lg" alt="" />
        </div>
        <div>
          <div class="kpi-num" id="kpi-accepted" style="color: var(--adco-green-primary);">0</div>
          <div class="kpi-title">الأنشطة المعتمدة والمقبولة</div>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon-wrap" style="background: #fef3c7;">
          <img src="../assets/icons/star.svg" class="ui-icon ui-icon-lg" alt="" />
        </div>
        <div>
          <div class="kpi-num" id="kpi-avg-score" style="color: #d97706;">0/100</div>
          <div class="kpi-title">متوسط التقييم الشامل (من 100)</div>
        </div>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="filter-chips">
        <button type="button" class="filter-chip active" data-filter="ALL">الكل</button>
        <button type="button" class="filter-chip" data-filter="Under Review">
          <img src="../assets/icons/clock.svg" class="ui-icon ui-icon-sm" alt="" />
          <span>قيد المراجعة</span>
        </button>
        <button type="button" class="filter-chip" data-filter="Accepted">
          <img src="../assets/icons/check-circle-2.svg" class="ui-icon ui-icon-sm" alt="" />
          <span>مقبول</span>
        </button>
        <button type="button" class="filter-chip" data-filter="Rejected">
          <img src="../assets/icons/x-circle.svg" class="ui-icon ui-icon-sm" alt="" />
          <span>مرفوض</span>
        </button>
      </div>

      <a href="./leaderboard.html" style="font-size: 0.85rem; color: var(--adco-green-primary); font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px;">
        <img src="../assets/icons/trophy.svg" class="ui-icon ui-icon-sm" alt="" />
        <span>عرض لوحة المتصدرين</span>
      </a>
    </div>

    <!-- Activities Cards Grid (Full-Width Responsive Multi-Column) -->
    <div id="activities-list"></div>
  </main>

  <script src="../js/ui-helpers.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/activity-manager.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const user = AuthManager.checkAuthGuard();
    AppRouter.init();

    if (user) {
      document.getElementById('welcome-title').textContent = `أهلاً، ${user.fullName}`;
      document.getElementById('welcome-role').textContent =
        user.role === 'supervisor' ? 'صلاحية المشرف العام - استعراض كافة السجلات الميدانية' : 'منسق عروض ميداني معتمد';
    }

    let currentFilter = 'ALL';

    function renderDashboard() {
      const allActivities =
        user && user.role === 'supervisor'
          ? ActivityManager.getAllActivities()
          : ActivityManager.getActivitiesForUser(user.employeeId);

      const accepted = allActivities.filter((a) => a.status === 'Accepted');
      const ratings = allActivities.map((a) => ActivityManager.computeWeightedEvaluation(a));
      const avgScore =
        ratings.length > 0
          ? Math.round(ratings.reduce((acc, c) => acc + c.totalWeightedScore, 0) / ratings.length)
          : 0;

      document.getElementById('kpi-total').textContent = allActivities.length;
      document.getElementById('kpi-accepted').textContent = accepted.length;
      document.getElementById('kpi-avg-score').textContent = `${avgScore}/100`;

      const filtered =
        currentFilter === 'ALL'
          ? allActivities
          : allActivities.filter((a) => a.status === currentFilter);

      const container = document.getElementById('activities-list');
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 48px 24px; grid-column: 1 / -1;">
            <p style="margin-bottom: 16px;">لا توجد بطاقات نشاط مطابقة لهذا التصنيف حالياً.</p>
            <a href="./activity-card.html" class="btn btn-primary btn-sm">
              <img src="../assets/icons/camera.svg" class="ui-icon ui-icon-sm" alt="" />
              <span>توثيق نشاط ميداني الآن</span>
            </a>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered
        .map((act) => {
          const ratingStats = ActivityManager.computeOverallRating(act);
          return `
            <a href="./activity-card.html?id=${act.id}" class="activity-card-item">
              <img src="${act.photoUrl}" alt="${act.client}" class="activity-card-thumb" />
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
                <div>
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 6px;">
                    <strong style="font-size: 0.95rem; color: var(--adco-green-deep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${act.client}</strong>
                    <div style="display: flex; gap: 4px; align-items: center;">
                      ${act.isClosed ? `<span class="badge badge-success" style="font-size:0.68rem; padding: 2px 6px;">منتهي</span>` : act.closureRequested ? `<span class="badge badge-warning" style="font-size:0.68rem; padding: 2px 6px;">طلب إنهاء</span>` : ''}
                      ${renderStatusBadge(act.status)}
                    </div>
                  </div>
                  <p style="font-size: 0.78rem; margin-bottom: 6px; color: var(--adco-gray-700); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                    ${act.branch} | <strong>${act.activity || '-'} (${act.activityType || '-'} × ${act.activityCount || 1})</strong>
                  </p>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.76rem; gap: 6px; margin-top: auto;">
                  <span class="badge badge-warning" style="background:#fffbeb; color:#92400e; font-weight: 700; white-space: nowrap;">
                    <img src="../assets/icons/star.svg" class="ui-icon ui-icon-sm" alt="" />
                    <span>التقييم: ${ratingStats.totalWeightedScore}/100</span>
                  </span>
                  <span style="color: var(--adco-gray-600); font-size: 0.74rem; white-space: nowrap;">
                    ${ratingStats.totalSessions} ${ratingStats.totalSessions === 1 ? 'متابعة' : 'متابعات'}
                  </span>
                </div>
              </div>
            </a>
          `;
        })
        .join('');
    }

    document.querySelectorAll('.filter-chip').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-chip').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderDashboard();
      });
    });

    renderDashboard();
  </script>
</body>
</html>
