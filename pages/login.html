<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#064e3b" />
  <title>تسجيل الدخول | شركة أدكو ADCO</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/mobile-pwa.css" />
</head>
<body>
  <div class="auth-floating-wrapper">
    <!-- Atmospheric Blurred Green Background Backdrop -->
    <div class="auth-floating-bg" aria-hidden="true">
      <img src="../assets/images/auth-hero-bg.webp" alt="" class="auth-floating-bg-img" />
      <div class="auth-floating-bg-overlay"></div>
      <div class="auth-floating-bg-ambient"></div>
    </div>

    <!-- Centered Floating Box -->
    <main class="auth-floating-card" style="background: #ffffff;">
      <div style="text-align: center; margin-bottom: 24px;">
        <a href="../index.html" style="display: inline-block; text-decoration: none;">
          <img src="../assets/images/ADCO-logo.png" alt="ADCO Logo" style="height: 52px; width: auto; object-fit: contain; margin-bottom: 12px;" />
        </a>
        <div style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; background: rgba(22, 101, 52, 0.08); border: 1px solid rgba(22, 101, 52, 0.18); border-radius: var(--radius-full); color: var(--adco-green-dark); font-size: 0.78rem; font-weight: 700; margin-bottom: 12px;">
          <img src="../assets/icons/shield-check.svg" class="ui-icon ui-icon-sm" alt="" />
          <span>بوابة العمليات الميدانية المعتمدة</span>
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--adco-green-deep); margin-bottom: 6px;">بوابة الدخول الموحد</h1>
        <p style="font-size: 0.88rem; color: var(--adco-gray-600); margin: 0;">أدخل الرقم الوظيفي وكلمة المرور المسجلة بسجلات أدكو</p>
      </div>

      <form id="login-form">
        <div class="form-group" style="margin-bottom: 18px;">
          <label class="form-label" for="employeeId" style="font-weight: 700; font-size: 0.88rem; margin-bottom: 8px;">الرقم الوظيفي (Employee ID)</label>
          <input
            type="text"
            id="employeeId"
            class="form-input"
            placeholder="مثال: ADCO-101 أو ADCO-901"
            required
            dir="ltr"
            style="text-align: right; font-size: 0.95rem; padding: 12px 14px; border-radius: var(--radius-md);"
          />
        </div>

        <div class="form-group" style="margin-bottom: 18px;">
          <label class="form-label" for="password" style="font-weight: 700; font-size: 0.88rem; margin-bottom: 8px;">كلمة المرور</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
            required
            style="font-size: 0.95rem; padding: 12px 14px; border-radius: var(--radius-md);"
          />
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.85rem;">
          <button
            type="button"
            id="open-reset-btn"
            style="background: none; border: none; color: var(--adco-green-primary); font-weight: 700; font-size: 0.85rem; cursor: pointer; padding: 0;"
          >
            نسيت كلمة المرور؟
          </button>
          <a href="./signup-wizard.html" style="color: var(--adco-green-dark); font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 4px;">
            <span>تفعيل حساب جديد</span>
            <img src="../assets/icons/arrow-left.svg" class="ui-icon ui-icon-sm" alt="" />
          </a>
        </div>

        <button type="submit" class="btn btn-primary" id="login-submit-btn" style="width: 100%; padding: 12px 20px; font-size: 1rem; border-radius: var(--radius-md); box-shadow: 0 4px 14px rgba(22, 101, 52, 0.35);">
          <img src="../assets/icons/log-in.svg" class="ui-icon" alt="" />
          <span>تسجيل الدخول</span>
        </button>
      </form>
    </main>

    <!-- Centered Atmospheric Footer -->
    <footer class="auth-floating-footer">
      <span>شركة الإسكندرية للكيماويات والمنظفات (ADCO) &copy; 2026</span>
      <span style="opacity: 0.6;">•</span>
      <span>نظام المتابعة والتوثيق الميداني المعتمد</span>
    </footer>

    <!-- Forgot Password Modal via OTP -->
    <div id="reset-modal" class="modal-overlay">
      <div class="modal-sheet">
        <div class="modal-header">
          <h3 style="display: flex; align-items: center; gap: 8px;">
            <img src="../assets/icons/shield-check.svg" class="ui-icon ui-icon-md" alt="" />
            <span>استعادة كلمة المرور عبر رمز التحقق</span>
          </h3>
          <button type="button" class="close-modal-btn" id="close-reset-modal">&times;</button>
        </div>

        <form id="reset-form">
          <div class="form-group">
            <label class="form-label">الرقم الوظيفي</label>
            <input type="text" id="reset-emp-id" class="form-input" placeholder="ADCO-101" required />
          </div>
          <div class="form-group">
            <label class="form-label">رقم الهاتف أو البريد الرسمي</label>
            <div style="display: flex; gap: 8px;">
              <input type="text" id="reset-contact" class="form-input" placeholder="01012345678" required />
              <button type="button" class="btn btn-secondary btn-sm" id="send-reset-otp-btn">إرسال الرمز</button>
            </div>
          </div>

          <div id="reset-otp-section" style="display: none;">
            <div class="form-group">
              <label class="form-label">رمز التحقق (4 أرقام - الرمز التجريبي: 5821)</label>
              <input type="text" id="reset-otp-code" class="form-input" maxlength="4" placeholder="5821" style="text-align: center; letter-spacing: 6px; font-weight: 700;" />
            </div>
            <div class="form-group">
              <label class="form-label">كلمة المرور الجديدة</label>
              <input type="password" id="reset-new-pass" class="form-input" placeholder="Pass@2026" />
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top: 8px;">تحديث كلمة المرور والدخول</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../js/ui-helpers.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const loginForm = document.getElementById('login-form');
    const empInput = document.getElementById('employeeId');
    const passInput = document.getElementById('password');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-submit-btn');
      btn.disabled = true;
      btn.innerHTML = `<span>جاري التحقق من الاعتماد...</span>`;

      try {
        const session = await AuthManager.login(empInput.value, passInput.value);
        showToast(`مرحباً بك ${session.user.fullName}`, 'success');
        setTimeout(() => {
          window.location.href = './dashboard.html';
        }, 350);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = `<img src="../assets/icons/log-in.svg" class="ui-icon" alt="" /><span>تسجيل الدخول</span>`;
      }
    });

    const resetModal = document.getElementById('reset-modal');
    document.getElementById('open-reset-btn').addEventListener('click', () => {
      resetModal.classList.add('active');
    });
    document.getElementById('close-reset-modal').addEventListener('click', () => {
      resetModal.classList.remove('active');
    });

    document.getElementById('send-reset-otp-btn').addEventListener('click', async () => {
      const contact = document.getElementById('reset-contact').value.trim();
      if (!contact) {
        return showToast('يرجى إدخال رقم الهاتف أو البريد أولاً', 'warning');
      }
      const res = await AuthManager.requestOTP(contact);
      document.getElementById('reset-otp-section').style.display = 'block';
      showToast(`تم إرسال رمز التحقق بنجاح`, 'success');
    });

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const empId = document.getElementById('reset-emp-id').value;
      const otp = document.getElementById('reset-otp-code').value;
      const newPass = document.getElementById('reset-new-pass').value;

      try {
        AuthManager.verifyOTP(otp);
        if (!AuthManager.validatePasswordComplexity(newPass)) {
          throw new Error('كلمة المرور يجب أن تكون 8 أحرف على الأقل وتحتوي على حرف كبير وصغير ورقم ورمز خاص.');
        }
        await AuthManager.finalizeRegistration(empId, newPass);
        showToast('تم تحديث كلمة المرور بنجاح، جاري الدخول...', 'success');
        setTimeout(() => {
          window.location.href = './dashboard.html';
        }, 400);
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
