      <rect x="0" y="0" width="55" height="75" rx="8" fill="url(#famaGrad)"/>
      <text x="27" y="42" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">فما</text>
      <text x="27" y="58" font-family="sans-serif" font-size="8" fill="#e9d5ff" text-anchor="middle">3 كجم</text>
    </g>
    <g transform="translate(440, 335)">
      <rect x="0" y="0" width="55" height="75" rx="8" fill="url(#famaGrad)"/>
      <text x="27" y="42" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">فما</text>
      <text x="27" y="58" font-family="sans-serif" font-size="8" fill="#e9d5ff" text-anchor="middle">3 كجم</text>
    </g>
    <g transform="translate(510, 335)">
      <rect x="0" y="0" width="55" height="75" rx="8" fill="url(#famaGrad)"/>
      <text x="27" y="42" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">فما</text>
      <text x="27" y="58" font-family="sans-serif" font-size="8" fill="#e9d5ff" text-anchor="middle">3 كجم</text>
