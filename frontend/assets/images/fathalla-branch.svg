      <rect x="11" y="-8" width="12" height="8" rx="2" fill="#bbf7d0"/>
      <text x="17" y="34" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">فييا</text>
