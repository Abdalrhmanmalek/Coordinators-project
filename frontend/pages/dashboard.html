<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>لوحة المنسق الميداني | ADCO Field Portal</title>
  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
  </script>
    <link rel="stylesheet" href="../css/app.min.css?v=7" />
<script src="../js/vendor/lucide.min.js"></script>
</head>
<body>
  <div id="app-header-mount"></div>

  <main class="web-main-workspace">
    <!-- Top Welcome & Quick Actions -->
    <div class="db-s1">
      <div>
        <h1 class="db-s2" id="welcome-title">لوحة المتابعة</h1>
        <p id="welcome-role"></p>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <button type="button" id="toggle-branch-filters-btn" class="filter-toggle-btn is-hidden" aria-expanded="false" aria-controls="sup-filter-toolbar">
          <i data-lucide="sliders-horizontal" class="ui-icon ui-icon-sm"></i>
          <span>بحث وتصفية</span>
          <span class="filter-active-badge is-hidden" id="db-filter-active-badge">0</span>
        </button>
        <a href="./activity-card.html" class="btn btn-primary">
          <i data-lucide="plus-circle" class="ui-icon"></i>
          <span>نشاط جديد</span>
        </a>
      </div>
    </div>

    <!-- KPI Row -->
    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-icon-wrap">
          <i data-lucide="layout-dashboard" class="ui-icon ui-icon-lg"></i>
        </div>
        <div>
          <div class="kpi-num" id="kpi-total">0</div>
          <div class="kpi-title">إجمالي الأنشطة</div>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon-wrap db-s3">
          <i data-lucide="check-circle-2" class="ui-icon ui-icon-lg"></i>
        </div>
        <div>
          <div class="kpi-num db-s4" id="kpi-accepted">0</div>
          <div class="kpi-title">الأنشطة المقبولة</div>
        </div>
      </div>

      <div class="kpi-card" id="kpi-card-under-review">
        <div class="kpi-icon-wrap db-s5">
          <i data-lucide="clock" class="ui-icon ui-icon-lg"></i>
        </div>
        <div>
          <div class="kpi-num db-s6" id="kpi-under-review">0</div>
          <div class="kpi-title">بانتظار التقييم</div>
        </div>
      </div>
    </div>

    <!-- Collapsible Filter Drawer for Manager & Coordinator Supervisor (Hidden by Default) -->
    <div id="sup-filter-toolbar" class="card db-s7 filter-drawer-collapsible is-hidden">
      <div class="db-s8">
        <div class="db-s9">
          <i data-lucide="shield-check" class="ui-icon ui-icon-sm"></i>
          <span id="sup-toolbar-title">تصفية الفروع: <strong id="sup-client-tag">جميع العملاء</strong></span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
          <button type="button" id="db-clear-filters-btn" class="filter-clear-btn is-hidden">
            <i data-lucide="x" class="ui-icon ui-icon-xs"></i>
            <span>مسح الفلاتر</span>
          </button>
        </div>
      </div>
      <div class="responsive-form-grid db-s10">
        <div class="form-group db-s11" id="group-filter-parent-client">
          <label class="form-label db-s12" for="filter-parent-client">العميل الأم</label>
          <select id="filter-parent-client" class="form-select db-s13">
            <option value="ALL">جميع السلاسل والعملاء</option>
          </select>
        </div>
        <div class="form-group db-s11">
          <label class="form-label db-s12" for="filter-sup-branch">الفرع</label>
          <select id="filter-sup-branch" class="form-select db-s13">
            <option value="ALL">كل فروع العميل</option>
          </select>
        </div>
        <div class="form-group db-s11" id="group-filter-sup-coord">
          <label class="form-label db-s12" for="filter-sup-coord">المنسق</label>
          <select id="filter-sup-coord" class="form-select db-s13">
            <option value="ALL">كل المنسقين</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Section 2: Master Branch Cards Section -->
    <section class="page-section page-section-branches branches-section">
      <div class="section-header-row">
        <h3 class="section-header-title">
          <i data-lucide="map-pin" class="ui-icon ui-icon-sm"></i>
          <span>بطاقات الفروع</span>
          <span class="section-count-pill" id="db-branches-count-pill">0</span>
        </h3>
        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
          <button type="button" id="reset-branch-card-filter" class="btn btn-outline btn-sm is-hidden">
            <span>عرض الكل</span>
          </button>
        </div>
      </div>
      <div id="master-branches-mount" class="master-branches-grid"></div>
    </section>

    <!-- Section 3: Filter Bar & Activities Feed Section -->
    <section class="page-section page-section-activities activities-section">
      <div class="section-header-row">
        <h3 class="section-header-title">
          <i data-lucide="shield-check" class="ui-icon ui-icon-sm"></i>
          <span>الأنشطة الميدانية</span>
        </h3>
      </div>

    <div class="filter-bar">
      <div class="filter-chips">
        <button type="button" class="filter-chip active" data-filter="ALL">
          <span>الكل</span>
          <span class="chip-count-pill" id="cnt-all">0</span>
        </button>
        <button type="button" class="filter-chip" data-filter="Under Review">
          <i data-lucide="clock" class="ui-icon ui-icon-sm"></i>
          <span>قيد المراجعة</span>
          <span class="chip-count-pill" id="cnt-review">0</span>
        </button>
        <button type="button" class="filter-chip" data-filter="Accepted">
          <i data-lucide="check-circle-2" class="ui-icon ui-icon-sm"></i>
          <span>مقبول</span>
          <span class="chip-count-pill" id="cnt-accepted">0</span>
        </button>
        <button type="button" class="filter-chip" data-filter="Rejected">
          <i data-lucide="x-circle" class="ui-icon ui-icon-sm"></i>
          <span>المرفوضة</span>
          <span class="chip-count-pill" id="cnt-rejected">0</span>
        </button>
        <button type="button" class="filter-chip" data-filter="CLOSED">
          <i data-lucide="archive" class="ui-icon ui-icon-sm"></i>
          <span>المنتهية</span>
          <span class="chip-count-pill" id="cnt-closed">0</span>
        </button>
      </div>
    </div>

    <!-- Activities Cards Grid (Full-Width Responsive Multi-Column) -->
    <div id="activities-list" class="responsive-cards-grid"></div>
    </section>
  </main>

  <script src="../js/config/env.config.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/ui-helpers.js"></script>
  <script src="../js/components/ui-combobox.js"></script>
  <script src="../js/components/ui-multi-combobox.js"></script>
  <script src="../js/components/gallery-lightbox.js"></script>
  <script src="../js/store/employee-registry.seed.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/config/adco-catalogs.config.js"></script>
  <script src="../js/store/seed-data-extra.js"></script>
  <script src="../js/store/seed-data.js"></script>
  <script src="../js/store/activity.store.js"></script>
  <script src="../js/services/branch.service.js"></script>
  <script src="../js/utils/gps-proximity.util.js"></script>
  <script src="../js/utils/score.util.js"></script>
  <script src="../js/utils/brand-share.util.js"></script>
  <script src="../js/services/activity-submission.service.js"></script>
  <script src="../js/services/activity-lifecycle.service.js"></script>
  <script src="../js/activity-manager.js"></script>
  <script src="../js/components/profile-modal.js?v=7"></script>
  <script src="../js/components/router-lifecycle.js"></script>
  <script src="../js/app.js?v=7"></script>
  <script src="../js/components/master-branch-card.js"></script>
  <script src="../js/components/activity-card-item.js"></script>
  <script src="../js/components/filter-dropdown.js?v=7"></script>
  <script src="../js/components/dashboard-branches.js?v=7"></script>
  <script src="../js/pages/dashboard.page.js?v=7"></script>
</body>
</html>
