<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>تحليلات الأداء Power BI | ADCO Field Portal</title>
  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
  </script>
    <link rel="stylesheet" href="../css/app.min.css?v=9" />
<script src="../js/vendor/lucide.min.js"></script>
</head>
<body>
  <div id="app-header-mount"></div>

  <main class="web-main-workspace">
    <div class="an-s1">
      <h2>التحليلات الميدانية</h2>
    </div>

    <div class="pbi-header">
      <div class="an-s2">
        <i data-lucide="bar-chart-3" class="ui-icon ui-icon-md"></i>
        <span>تحليلات العمليات</span>
      </div>
      <span class="badge badge-mint">مباشر</span>
    </div>

    <!-- Campaign Slicers Card -->
    <div class="card an-s3">
      <h4 class="an-s4">
        <i data-lucide="sliders-horizontal" class="ui-icon ui-icon-sm"></i>
        <span>فلاتر الحملات والتوريد</span>
      </h4>
      <div class="responsive-form-grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));">
        <div>
          <label class="form-label">العميل</label>
          <select id="bi-client-filter" class="form-select">
            <option value="ALL">جميع السلاسل</option>
            <option value="فتح الله">فتح الله جملة ماركت</option>
            <option value="زهران">سوبر ماركت زهران</option>
            <option value="كارفور">كارفور هايبر ماركت</option>
          </select>
        </div>
        <div>
          <label class="form-label">النشاط</label>
          <select id="bi-display-filter" class="form-select">
            <option value="ALL">جميع الأنشطة</option>
            <option value="عقد">عقد</option>
            <option value="فرشة مجلة">فرشة مجلة</option>
            <option value="إضافي">إضافي</option>
            <option value="افتتاح فرع جديد">افتتاح فرع جديد</option>
            <option value="مهرجان">مهرجان</option>
            <option value="موسمي">موسمي</option>
          </select>
        </div>
        <div>
          <label class="form-label">فرع التوريد</label>
          <select id="bi-supply-branch-filter" class="form-select">
            <option value="ALL">جميع فروع التوريد</option>
            <option value="قطاع وسط">الإسكندرية - قطاع وسط</option>
            <option value="قطاع شرق">الإسكندرية - قطاع شرق</option>
            <option value="قطاع غرب">الإسكندرية - قطاع غرب</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Row 1: 4 Circular Progress Ring Indicators -->
    <div class="circular-charts-row" id="circular-rings-mount">
      <div class="circular-ring-card">
        <div class="ring-svg-wrap">
          <svg class="ring-svg" viewBox="0 0 84 84">
            <circle class="ring-bg" cx="42" cy="42" r="34"></circle>
            <circle class="ring-progress" id="ring-acc-circle" cx="42" cy="42" r="34" stroke-dasharray="213.6" stroke-dashoffset="17"></circle>
          </svg>
          <div class="ring-center-text" id="bi-acc-rate">92%</div>
        </div>
        <div class="ring-info">
          <span class="ring-title">نسبة القبول</span>
        </div>
      </div>

      <div class="circular-ring-card">
        <div class="ring-svg-wrap">
          <svg class="ring-svg" viewBox="0 0 84 84">
            <circle class="ring-bg" cx="42" cy="42" r="34"></circle>
            <circle class="ring-progress ring-teal-vivid" id="ring-qual-circle" cx="42" cy="42" r="34" stroke-dasharray="213.6" stroke-dashoffset="21"></circle>
          </svg>
          <div class="ring-center-text" id="bi-avg-quality">9.0/10</div>
        </div>
        <div class="ring-info">
          <span class="ring-title">متوسط الجودة</span>
        </div>
      </div>

      <div class="circular-ring-card">
        <div class="ring-svg-wrap">
          <svg class="ring-svg" viewBox="0 0 84 84">
            <circle class="ring-bg" cx="42" cy="42" r="34"></circle>
            <circle class="ring-progress ring-amber" id="ring-score-circle" cx="42" cy="42" r="34" stroke-dasharray="213.6" stroke-dashoffset="24"></circle>
          </svg>
          <div class="ring-center-text" id="bi-weighted-score">89%</div>
        </div>
        <div class="ring-info">
          <span class="ring-title">التقييم الموزون</span>
        </div>
      </div>

      <div class="circular-ring-card">
        <div class="ring-svg-wrap">
          <svg class="ring-svg" viewBox="0 0 84 84">
            <circle class="ring-bg" cx="42" cy="42" r="34"></circle>
            <circle class="ring-progress ring-indigo" id="ring-gps-circle" cx="42" cy="42" r="34" stroke-dasharray="213.6" stroke-dashoffset="6"></circle>
          </svg>
          <div class="ring-center-text" id="bi-gps-rate">98%</div>
        </div>
        <div class="ring-info">
          <span class="ring-title">توثيق الموقع</span>
        </div>
      </div>
    </div>

    <!-- Row 2: Right Chart + Left Chart -->
    <div class="analytics-dashboard-grid">
      <!-- Right Chart in RTL: Brand Share & Activity Histogram -->
      <div class="chart-card">
        <div class="chart-card-header">
          <div>
            <h4 class="chart-card-title">حصة العلامات التجارية</h4>
          </div>
          <span class="badge badge-mint" id="hist-brand-summary-badge">إجمالي الحصص</span>
        </div>

        <!-- Inline Filters for Right Histogram Chart -->
        <div class="chart-inline-filters">
          <div class="chart-filter-field">
            <label class="form-label" for="hist-brand-select">العلامة التجارية</label>
            <select id="hist-brand-select" class="form-select">
              <option value="فلفيتا" selected>فلفيتا</option>
              <option value="جلاسي">جلاسي</option>
              <option value="ديفا">ديفا</option>
              <option value="سبيد">سبيد</option>
              <option value="فما">فما</option>
              <option value="فييا">فييا</option>
              <option value="كلوريل">كلوريل</option>
              <option value="ماكسيل ماجيك">ماكسيل ماجيك</option>
            </select>
          </div>

          <div class="chart-filter-field">
            <label class="form-label" for="hist-acttype-select">نوع النشاط</label>
            <select id="hist-acttype-select" class="form-select">
              <option value="ALL" selected>جميع أنواع الأنشطة</option>
              <option value="جندولة">جندولة</option>
              <option value="دريس أب">دريس أب</option>
              <option value="ستاند">ستاند</option>
              <option value="فلور">فلور</option>
              <option value="بوديوم">بوديوم</option>
              <option value="بيلر">بيلر</option>
              <option value="سايد جندولة">سايد جندولة</option>
              <option value="لايت بوكس">لايت بوكس</option>
            </select>
          </div>

          <div class="chart-filter-field">
            <label class="form-label" for="hist-timerange-select">الفترة الزمنية</label>
            <select id="hist-timerange-select" class="form-select">
              <option value="ALL" selected>كل الفترات الزمنية</option>
              <option value="7D">آخر 7 أيام</option>
              <option value="30D">آخر 30 يوماً</option>
              <option value="90D">الربع الحالي (90 يوماً)</option>
              <option value="180D">الأشهر الـ 6 الأخيرة</option>
            </select>
          </div>
        </div>

        <div class="vbar-chart-grid histogram-chart-grid" id="brand-histogram-mount"></div>
        <div class="chart-kpi-strip" id="brand-histogram-kpis"></div>
      </div>

      <!-- Left Chart in RTL: Activity Types & Brand Pie/Distribution Chart -->
      <div class="chart-card">
        <div class="chart-card-header">
          <div>
            <h4 class="chart-card-title">توزيع الحصص حسب النشاط</h4>
          </div>
          <span class="badge badge-success" id="pie-acttype-badge">جندولة</span>
        </div>

        <!-- Inline Activity Type Selector for Left Pie Chart -->
        <div class="chart-inline-filters" style="grid-template-columns: 1fr;">
          <div class="chart-filter-field">
            <label class="form-label" for="pie-acttype-select">نوع النشاط</label>
            <select id="pie-acttype-select" class="form-select">
              <option value="جندولة" selected>جندولة</option>
              <option value="دريس أب">دريس أب</option>
              <option value="ستاند">ستاند</option>
              <option value="فلور">فلور</option>
              <option value="بوديوم">بوديوم</option>
              <option value="بيلر">بيلر</option>
              <option value="سايد جندولة">سايد جندولة</option>
              <option value="لايت بوكس">لايت بوكس</option>
              <option value="ALL">جميع وسائل العرض الميدانية</option>
            </select>
          </div>
        </div>

        <div class="pie-chart-layout" id="activity-brand-pie-mount"></div>
      </div>
    </div>

    <!-- Row 3: Display Hardware Type Breakdown -->
    <div class="chart-card" style="margin-bottom: 12px;">
      <div class="chart-card-header">
        <div>
          <h4 class="chart-card-title">وسائل العرض الميدانية</h4>
        </div>
        <span class="badge badge-mint">تحديث فوري</span>
      </div>
      <div class="vbar-chart-grid" id="display-type-vbar-mount"></div>
    </div>
  </main>

  <script src="../js/config/env.config.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/ui-helpers.js"></script>
  <script src="../js/components/ui-combobox.js"></script>
  <script src="../js/components/ui-multi-combobox.js"></script>
  <script src="../js/components/gallery-lightbox.js"></script>
  <script src="../js/store/employee-registry.seed.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/config/adco-catalogs.config.js"></script>
  <script src="../js/store/seed-data-extra.js"></script>
  <script src="../js/store/seed-data.js"></script>
  <script src="../js/store/activity.store.js"></script>
  <script src="../js/services/branch.service.js"></script>
  <script src="../js/utils/gps-proximity.util.js"></script>
  <script src="../js/utils/score.util.js"></script>
  <script src="../js/utils/brand-share.util.js"></script>
  <script src="../js/services/activity-submission.service.js"></script>
  <script src="../js/services/activity-lifecycle.service.js"></script>
  <script src="../js/activity-manager.js"></script>
  <script src="../js/components/profile-modal.js?v=9"></script>
  <script src="../js/components/router-lifecycle.js"></script>
  <script src="../js/app.js?v=9"></script>
  <script src="../js/components/analytics-charts.js"></script>
  <script src="../js/pages/analytics.page.js"></script>
</body>
</html>
