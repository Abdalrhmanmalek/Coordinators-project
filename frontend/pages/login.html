<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>تسجيل الدخول | شركة أدكو ADCO</title>
  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
  </script>
    <link rel="stylesheet" href="../css/app.min.css?v=9" />
<script src="../js/vendor/lucide.min.js"></script>
</head>
<body>
  <div class="auth-floating-wrapper">
    <!-- Atmospheric Blurred Green Background Backdrop -->
    <div class="auth-floating-bg" aria-hidden="true">
      <img src="../assets/images/auth-hero-bg.avif" alt="" class="auth-floating-bg-img" />
      <div class="auth-floating-bg-overlay"></div>
      <div class="auth-floating-bg-ambient"></div>
    </div>

    <!-- Centered Floating Box -->
    <main class="auth-floating-card lg-s1">
      <div class="lg-s2">
        <a class="lg-s3" href="../index.html">
          <img class="lg-s4" src="../assets/images/ADCO-logo.avif" alt="ADCO Logo" />
        </a>
        <div class="lg-s5">
          <i data-lucide="shield-check" class="ui-icon ui-icon-sm"></i>
          <span>بوابة العمليات الميدانية المعتمدة</span>
        </div>
        <h1 class="lg-s6">منظومة ادارة العمليات</h1>
        <p class="lg-s7">أدخل كود الموظف وكلمة المرور لتسجيل الدخول</p>
      </div>

      <form id="login-form">
        <div class="form-group lg-s8">
          <label class="form-label lg-s9" for="employeeId">كود الموظف (Company Employee Code)</label>
          <input
            type="text"
            id="employeeId"
            class="form-input lg-s10"
            placeholder="أدخل كود الموظف الخاص بك..."
            required
            dir="ltr"
          />
        </div>

        <div class="form-group lg-s8">
          <label class="form-label lg-s9" for="password">كلمة المرور</label>
          <input
            type="password"
            id="password"
            class="form-input lg-s11"
            placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
            required
          />
        </div>

        <div class="lg-s12">
          <button class="lg-s13"
            type="button"
            id="open-reset-btn"
          >
            نسيت كلمة المرور؟
          </button>
          <a class="lg-s14" href="./signup-wizard.html">
            <span>تفعيل حساب جديد</span>
            <i data-lucide="arrow-left" class="ui-icon ui-icon-sm"></i>
          </a>
        </div>

        <button type="submit" class="btn btn-primary lg-s15" id="login-submit-btn">
          <i data-lucide="log-in" class="ui-icon"></i>
          <span>تسجيل الدخول</span>
        </button>
      </form>
    </main>

    <!-- Centered Atmospheric Footer -->
    <footer class="auth-floating-footer">
      <span>(ADCO) شركة الاسكندريه للكيماويات و المنظفات &copy; 2026</span>
      <span class="lg-s22">•</span>
      <span>نظام المتابعة والتوثيق الميداني المعتمد</span>
    </footer>

    <!-- Forgot Password Modal via OTP -->
    <div id="reset-modal" class="modal-overlay">
      <div class="modal-sheet">
        <div class="modal-header">
          <h3 class="lg-s23">
            <i data-lucide="shield-check" class="ui-icon ui-icon-md"></i>
            <span>استعادة كلمة المرور عبر رمز التحقق</span>
          </h3>
          <button type="button" class="close-modal-btn" id="close-reset-modal">&times;</button>
        </div>

        <form id="reset-form">
          <div class="form-group">
            <label class="form-label">الرقم الوظيفي</label>
            <input type="text" id="reset-emp-id" class="form-input" placeholder="ADCO-101" required />
          </div>
          <div class="form-group">
            <label class="form-label">رقم الهاتف أو البريد الرسمي</label>
            <div class="lg-s24">
              <input type="text" id="reset-contact" class="form-input" placeholder="01012345678" required />
              <button type="button" class="btn btn-secondary btn-sm" id="send-reset-otp-btn">إرسال الرمز</button>
            </div>
          </div>

          <div class="is-hidden" id="reset-otp-section">
            <div class="form-group">
              <label class="form-label">رمز التحقق (4 أرقام - الرمز التجريبي: 5821)</label>
              <input type="text" id="reset-otp-code" class="form-input lg-s25" maxlength="4" placeholder="5821" />
            </div>
            <div class="form-group">
              <label class="form-label">كلمة المرور الجديدة</label>
              <input type="password" id="reset-new-pass" class="form-input" placeholder="Pass@2026" />
            </div>
            <button type="submit" class="btn btn-primary lg-s26">تحديث كلمة المرور والدخول</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../js/config/env.config.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/ui-helpers.js"></script>
  <script src="../js/components/ui-combobox.js"></script>
  <script src="../js/components/ui-multi-combobox.js"></script>
  <script src="../js/components/gallery-lightbox.js"></script>
  <script src="../js/store/employee-registry.seed.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/pages/login.page.js"></script>
</body>
</html>
