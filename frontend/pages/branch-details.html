<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>تفاصيل الفرع وسجل الأنشطة | ADCO Field Portal</title>
  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
  </script>
    <link rel="stylesheet" href="../css/app.min.css?v=9" />
<script src="../js/vendor/lucide.min.js"></script>
</head>
<body>
  <div id="app-header-mount"></div>

  <main class="web-main-workspace">
    <!-- Top Breadcrumb & Back Action -->
    <div class="db-s1">
      <div>
        <h1 class="db-s2" id="bd-client-title">فتح الله جملة ماركت (Fathalla)</h1>
        <p id="bd-branch-subtitle">فرع سموحة - الإسكندرية</p>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <a href="./dashboard.html" class="btn btn-secondary" id="bd-back-btn">
          <i data-lucide="arrow-left" class="ui-icon ui-icon-sm"></i>
          <span>رجوع</span>
        </a>
        <a href="./activity-card.html" class="btn btn-primary">
          <i data-lucide="plus-circle" class="ui-icon ui-icon-sm"></i>
          <span>نشاط جديد</span>
        </a>
      </div>
    </div>

    <!-- Master Branch Full Metadata Hero Card -->
    <div class="card" id="bd-hero-meta-card" style="margin-bottom: 24px;">
      <!-- Populated dynamically via branch-details.page.js -->
    </div>

    <!-- KPI Row for this specific branch -->
    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-icon-wrap">
          <i data-lucide="layout-dashboard" class="ui-icon ui-icon-lg"></i>
        </div>
        <div>
          <div class="kpi-num" id="bd-kpi-total">0</div>
          <div class="kpi-title">إجمالي الأنشطة</div>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-icon-wrap db-s3">
          <i data-lucide="check-circle-2" class="ui-icon ui-icon-lg"></i>
        </div>
        <div>
          <div class="kpi-num db-s4" id="bd-kpi-accepted">0</div>
          <div class="kpi-title">الأنشطة المقبولة</div>
        </div>
      </div>

      <div class="kpi-card" id="bd-kpi-card-under-review">
        <div class="kpi-icon-wrap db-s5">
          <i data-lucide="clock" class="ui-icon ui-icon-lg"></i>
        </div>
        <div>
          <div class="kpi-num db-s6" id="bd-kpi-under-review">0</div>
          <div class="kpi-title">بانتظار المراجعة والتقييم</div>
        </div>
      </div>
    </div>

    <!-- Advanced Activity Filter Toolbar inside Branch Details View -->
    <div class="card db-s7" style="margin-bottom: 18px; padding: 18px 22px;">
      <div class="db-s8" style="margin-bottom: 12px;">
        <div class="db-s9">
          <i data-lucide="sliders-horizontal" class="ui-icon ui-icon-sm"></i>
          <span>تصفية أنشطة الفرع المتقدمة (حسب نوع النشاط، التاريخ والوقت، وحالة النشاط)</span>
        </div>
        <button type="button" id="bd-reset-filters-btn" class="btn btn-secondary btn-sm" style="min-height: 32px; padding: 4px 12px; font-size: 0.78rem;">
          إعادة ضبط الفلاتر
        </button>
      </div>
      <div class="responsive-form-grid">
        <div class="form-group">
          <label class="form-label" for="bd-filter-activity-type">نوع النشاط (Activity Type)</label>
          <select id="bd-filter-activity-type" class="form-select">
            <option value="ALL">جميع أنواع الأنشطة</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="bd-filter-status-select">حالة النشاط (Activity Status)</label>
          <select id="bd-filter-status-select" class="form-select">
            <option value="ALL">الكل (جميع الحالات)</option>
            <option value="Accepted">المقبولة</option>
            <option value="Under Review">تحت المراجعة</option>
            <option value="Rejected">المرفوضة</option>
            <option value="CLOSED">المنتهية</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="bd-filter-date-from">من التاريخ والوقت (From Date/Time)</label>
          <input type="datetime-local" id="bd-filter-date-from" class="form-input" />
        </div>
        <div class="form-group">
          <label class="form-label" for="bd-filter-date-to">إلى التاريخ والوقت (To Date/Time)</label>
          <input type="datetime-local" id="bd-filter-date-to" class="form-input" />
        </div>
      </div>
    </div>

    <!-- Filter Bar (Quick Status Overview Chips: المنتهية right next to المرفوضة) -->
    <div class="filter-bar">
      <div class="filter-chips">
        <button type="button" class="filter-chip active" data-filter="ALL">
          <span>الكل</span>
          <span class="chip-count-pill" id="bd-cnt-all">0</span>
        </button>
        <button type="button" class="filter-chip" data-filter="Accepted">
          <i data-lucide="check-circle-2" class="ui-icon ui-icon-sm"></i>
          <span>المقبولة</span>
          <span class="chip-count-pill" id="bd-cnt-accepted">0</span>
        </button>
        <button type="button" class="filter-chip" data-filter="Under Review">
          <i data-lucide="clock" class="ui-icon ui-icon-sm"></i>
          <span>تحت المراجعة</span>
          <span class="chip-count-pill" id="bd-cnt-review">0</span>
        </button>
        <button type="button" class="filter-chip" data-filter="Rejected">
          <i data-lucide="x-circle" class="ui-icon ui-icon-sm"></i>
          <span>المرفوضة</span>
          <span class="chip-count-pill" id="bd-cnt-rejected">0</span>
        </button>
        <button type="button" class="filter-chip" data-filter="CLOSED">
          <i data-lucide="archive" class="ui-icon ui-icon-sm"></i>
          <span>المنتهية</span>
          <span class="chip-count-pill" id="bd-cnt-closed">0</span>
        </button>
      </div>
    </div>

    <!-- Branch Activities Grid -->
    <div id="activities-list"></div>
  </main>

  <script src="../js/config/env.config.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/ui-helpers.js"></script>
  <script src="../js/components/ui-combobox.js"></script>
  <script src="../js/components/ui-multi-combobox.js"></script>
  <script src="../js/components/gallery-lightbox.js"></script>
  <script src="../js/store/employee-registry.seed.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/config/adco-catalogs.config.js"></script>
  <script src="../js/store/seed-data-extra.js"></script>
  <script src="../js/store/seed-data.js"></script>
  <script src="../js/store/activity.store.js"></script>
  <script src="../js/services/branch.service.js"></script>
  <script src="../js/utils/gps-proximity.util.js"></script>
  <script src="../js/utils/score.util.js"></script>
  <script src="../js/utils/brand-share.util.js"></script>
  <script src="../js/services/activity-submission.service.js"></script>
  <script src="../js/services/activity-lifecycle.service.js"></script>
  <script src="../js/components/activity-card-item.js"></script>
  <script src="../js/activity-manager.js"></script>
  <script src="../js/components/profile-modal.js?v=9"></script>
  <script src="../js/components/router-lifecycle.js"></script>
  <script src="../js/app.js?v=9"></script>
  <script src="../js/components/branch-hero-card.js"></script>
  <script src="../js/pages/branch-details.page.js"></script>
</body>
</html>
