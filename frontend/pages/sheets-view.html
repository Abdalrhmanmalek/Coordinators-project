<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>مزامنة Google Sheets وتصدير Excel | ADCO Field Portal</title>
  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
  </script>
    <link rel="stylesheet" href="../css/app.min.css" />
<script src="../js/vendor/lucide.min.js"></script>
</head>
<body>
  <div id="app-header-mount"></div>

  <main class="web-main-workspace">
    <!-- Header Title & Export Action -->
    <div class="sh-s1">
      <div>
        <h2>التقارير والشيتات</h2>
      </div>
      <button type="button" id="export-excel-btn" class="btn btn-primary">
        <i data-lucide="file-spreadsheet" class="ui-icon"></i>
        <span>تصدير Excel</span>
      </button>
    </div>

    <!-- Filter Toolbar with Interactive Parameters -->
    <div class="card sh-s2">
      <div class="sh-s3">
        <h4 class="sh-s4">
          <i data-lucide="sliders-horizontal" class="ui-icon ui-icon-sm"></i>
          <span>تصفية البيانات</span>
        </h4>
        <button type="button" id="reset-sheet-filters" class="btn btn-secondary btn-sm sh-s5">
          إعادة ضبط
        </button>
      </div>

      <div class="responsive-form-grid sh-s6">
        <div>
          <label class="form-label sh-s7">العميل</label>
          <select id="flt-client" class="form-select sh-s8">
            <option value="ALL">جميع العملاء</option>
          </select>
        </div>

        <div>
          <label class="form-label sh-s7">العلامة التجارية</label>
          <select id="flt-brand" class="form-select sh-s8">
            <option value="ALL">جميع العلامات</option>
          </select>
        </div>

        <div>
          <label class="form-label sh-s7">النشاط</label>
          <select id="flt-activity" class="form-select sh-s8">
            <option value="ALL">جميع الأنشطة</option>
          </select>
        </div>

        <div>
          <label class="form-label sh-s7">نوع النشاط</label>
          <select id="flt-activity-type" class="form-select sh-s8">
            <option value="ALL">جميع الأنواع</option>
          </select>
        </div>

        <div>
          <label class="form-label sh-s7">حالة الاعتماد</label>
          <select id="flt-status" class="form-select sh-s8">
            <option value="ALL">جميع الحالات</option>
            <option value="Accepted">مقبول</option>
            <option value="Under Review">قيد المراجعة</option>
            <option value="Rejected">مرفوض</option>
          </select>
        </div>

        <div>
          <label class="form-label sh-s7">حالة إنهاء النشاط</label>
          <select id="flt-closure" class="form-select sh-s8">
            <option value="ALL">الكل</option>
            <option value="ACTIVE">نشط</option>
            <option value="CLOSED">منتهي</option>
            <option value="PENDING">قيد الإنهاء</option>
          </select>
        </div>

        <div>
          <label class="form-label sh-s7">من تاريخ</label>
          <input type="date" id="flt-date-from" class="form-input sh-s8" />
        </div>

        <div>
          <label class="form-label sh-s7">إلى تاريخ</label>
          <input type="date" id="flt-date-to" class="form-input sh-s8" />
        </div>

        <div class="sh-s9">
          <input
            type="text"
            id="sheet-search"
            class="form-input sh-s10"
            placeholder="بحث برقم البطاقة، المنسق، الفرع..."
          />
        </div>
      </div>
    </div>

    <div class="sheets-toolbar">
      <div class="sh-s11">
        <i data-lucide="table-2" class="ui-icon ui-icon-md"></i>
        <span class="sh-s12">ADCO_Master_Brand_Share_Sheet_2026</span>
      </div>
      <span class="badge badge-mint" id="total-rows-badge">جاري التحميل...</span>
    </div>

    <!-- Full-Bleed Widescreen Data Table -->
    <div class="table-scroll grid-scroll-wrapper sh-s13">
      <table class="sheets-grid">
        <thead>
          <tr>
            <th>#</th>
            <th>كود البطاقة</th>
            <th>المنسق</th>
            <th>العميل</th>
            <th>الفرع</th>
            <th>العلامة التجارية</th>
            <th>حصة البراند</th>
            <th>النشاط</th>
            <th>نوع النشاط</th>
            <th>العدد</th>
            <th>تاريخ البدء</th>
            <th>تاريخ الانتهاء</th>
            <th>تاريخ المجلة</th>
            <th>التقييم</th>
            <th>الحالة</th>
            <th>المشرف</th>
            <th>تاريخ المراجعة</th>
            <th>حالة الإنهاء</th>
            <th>ملاحظات المشرف</th>
          </tr>
        </thead>
        <tbody id="sheet-rows-mount"></tbody>
      </table>
    </div>
  </main>

  <script src="../js/config/env.config.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/ui-helpers.js"></script>
  <script src="../js/store/employee-registry.seed.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/config/adco-catalogs.config.js"></script>
  <script src="../js/store/seed-data.js"></script>
  <script src="../js/store/activity.store.js"></script>
  <script src="../js/services/branch.service.js"></script>
  <script src="../js/utils/gps-proximity.util.js"></script>
  <script src="../js/utils/score.util.js"></script>
  <script src="../js/utils/brand-share.util.js"></script>
  <script src="../js/services/activity-submission.service.js"></script>
  <script src="../js/services/activity-lifecycle.service.js"></script>
  <script src="../js/activity-manager.js"></script>
  <script src="../js/services/report-export.service.js"></script>
  <script src="../js/supervisor.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/sheets.page.js"></script>
</body>
</html>
