<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#15803d" />
  <title>لوحة شرف المنسقين والترتيب | ADCO Field Portal</title>
    <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <style>
    .podium-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 20px;
      margin: 20px 0 32px;
      padding: 32px 20px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--adco-gray-200);
      box-shadow: var(--shadow-sm);
    }
    @media (max-width: 640px) {
      .podium-wrap {
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
        padding: 20px 14px;
      }
      .podium-col {
        max-width: 100% !important;
        transform: none !important;
      }
    }
    .podium-col {
      flex: 1;
      max-width: 260px;
      text-align: center;
      background: var(--adco-gray-50);
      border-radius: var(--radius-md);
      padding: 24px 16px;
      border: 1.5px solid var(--adco-gray-200);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .podium-col.first {
      border-color: #f59e0b;
      transform: translateY(-12px);
      background: #fffbeb;
      box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.2);
    }
    .podium-medal-img {
      width: 64px;
      height: 64px;
      margin-bottom: 8px;
      object-fit: contain;
    }
    .rank-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: #ffffff;
      border: 1px solid var(--adco-gray-200);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }
    .rank-num {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--adco-green-soft);
      color: var(--adco-green-deep);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.88rem;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="app-header-mount"></div>

  <main class="web-main-workspace">
    <div style="margin-bottom: 24px;">
      <h2>لوحة شرف المنسقين الميدانيين</h2>
      <p>التصنيف التراكمي لنقاط الأداء والجودة بناءً على الأنشطة المعتمدة وتقييمات المشرفين</p>
    </div>

    <!-- Top-3 Podium (With SVG Medals) -->
    <div class="podium-wrap" id="podium-mount"></div>

    <h3 style="margin-bottom: 16px;">القائمة العامة للمنسقين</h3>
    <div id="leaderboard-list"></div>
  </main>

    <script type="module" src="../js/pages/leaderboard.page.js"></script>
</body>
</html>
