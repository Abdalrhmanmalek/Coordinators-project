<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>لوحة شرف المنسقين والترتيب الميداني | شركة أدكو ADCO</title>
  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
  </script>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/leaderboard.css" />
  <link rel="stylesheet" href="../css/enhancements.css" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/mobile-pwa.css" />
</head>
<body>
  <div id="app-header-mount"></div>

  <main class="web-main-workspace lb-workspace">
    <!-- Header Hero Section with Classore Period Tabs -->
    <header class="lb-hero-header">
      <div class="lb-hero-text">
        <div class="lb-hero-badge">
          <img src="../assets/icons/trophy.svg" class="ui-icon ui-icon-xs" alt="" />
          <span>منظومة شرف التنافس الميداني (Gamified Leaderboard)</span>
        </div>
        <h1 class="lb-hero-title">لوحة شرف وتصنيف منسقي أدكو</h1>
        <p class="lb-hero-desc">
          التصنيف التراكمي المعتمد لنقاط الجودة والالتزام الميداني بناءً على الأنشطة المعتمدة وتقييمات المشرفين
        </p>
      </div>

      <!-- Classore Signature Period Filter Segmented Tabs -->
      <div class="lb-tabs-wrap">
        <div class="lb-period-tabs" role="tablist" aria-label="فترات التصنيف">
          <button type="button" class="lb-tab-btn active" data-period="month" role="tab" aria-selected="true">
            <span>هذا الشهر (الدورة الحالية)</span>
          </button>
          <button type="button" class="lb-tab-btn" data-period="week" role="tab" aria-selected="false">
            <span>هذا الأسبوع</span>
          </button>
          <button type="button" class="lb-tab-btn" data-period="all" role="tab" aria-selected="false">
            <span>التصنيف التراكمي (الكل)</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Classore Current User Sticky Rank Banner ("Your Rank / أنت") -->
    <section class="lb-user-card" id="user-rank-banner" aria-label="ترتيبك الميداني">
      <!-- Populated dynamically via leaderboard.page.js -->
    </section>

    <!-- Top-3 Elevated 3D Podium Mount -->
    <section class="lb-podium-section" aria-label="منصة تتويج الثلاثة الأوائل">
      <div class="lb-podium-title-row">
        <div class="lb-section-heading">
          <img src="../assets/icons/star.svg" class="ui-icon ui-icon-sm" alt="" />
          <span>أبطال التميز الميداني (Top 3 Performers)</span>
        </div>
        <div class="lb-stats-chips">
          <span class="lb-chip" id="lb-chip-total">إجمالي المنسقين: <strong>-</strong></span>
          <span class="lb-chip" id="lb-chip-avg">متوسط الجودة: <strong>-</strong></span>
        </div>
      </div>

      <div class="podium-wrap" id="podium-mount">
        <!-- Rendered dynamically via leaderboard.page.js -->
      </div>
    </section>

    <!-- General Ranking List with Search and Filter Toolbar -->
    <section class="lb-list-section">
      <div class="lb-list-toolbar">
        <div class="lb-section-heading">
          <img src="../assets/icons/shield-check.svg" class="ui-icon ui-icon-sm" alt="" />
          <span>القائمة العامة لترتيب المنسقين</span>
        </div>

        <div class="lb-search-box">
          <img src="../assets/icons/search.svg" class="ui-icon ui-icon-xs lb-search-icon" alt="" />
          <input
            type="search"
            id="lb-search-input"
            class="lb-search-input"
            placeholder="ابحث باسم المنسق أو الفرع..."
            aria-label="البحث في قائمة الترتيب"
          />
        </div>
      </div>

      <div class="lb-table-container">
        <div id="leaderboard-list" class="lb-cards-list">
          <!-- Rendered dynamically via leaderboard.page.js -->
        </div>
      </div>
    </section>
  </main>

  <script src="../js/config/env.config.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/ui-helpers.js"></script>
  <script src="../js/store/employee-registry.seed.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/config/adco-catalogs.config.js"></script>
  <script src="../js/store/seed-data.js"></script>
  <script src="../js/store/activity.store.js"></script>
  <script src="../js/services/branch.service.js"></script>
  <script src="../js/utils/gps-proximity.util.js"></script>
  <script src="../js/utils/score.util.js"></script>
  <script src="../js/utils/brand-share.util.js"></script>
  <script src="../js/services/activity-submission.service.js"></script>
  <script src="../js/services/activity-lifecycle.service.js"></script>
  <script src="../js/activity-manager.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/leaderboard.page.js"></script>
</body>
</html>
