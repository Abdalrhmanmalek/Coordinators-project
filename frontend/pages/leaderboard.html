<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>لوحة شرف المنسقين والترتيب الميداني | شركة أدكو ADCO</title>
  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
  </script>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/leaderboard.css" />
  <link rel="stylesheet" href="../css/enhancements.css" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/mobile-pwa.css" />
</head>
<body>
  <div id="app-header-mount"></div>

  <main class="web-main-workspace lb-workspace">
    <!-- Header Title & Filter Bar -->
    <header class="lb-page-header">
      <div class="lb-header-info">
        <h1 class="lb-page-title">المتصدرين في العمليات الميدانية (Top Coordinators)</h1>
        <p class="lb-page-sub">تصنيف نقاط الأداء وجودة توثيق العروض بناءً على الأنشطة المعتمدة لدى المشرفين</p>
      </div>

      <!-- Period Tabs & Quick Search -->
      <div class="lb-header-actions">
        <div class="lb-period-segmented" role="tablist" aria-label="فترات التقييم">
          <button type="button" class="lb-period-btn active" data-period="month" role="tab" aria-selected="true">هذا الشهر</button>
          <button type="button" class="lb-period-btn" data-period="week" role="tab" aria-selected="false">هذا الأسبوع</button>
          <button type="button" class="lb-period-btn" data-period="all" role="tab" aria-selected="false">الكل</button>
        </div>

        <div class="lb-search-input-wrap">
          <img src="../assets/icons/search.svg" class="ui-icon ui-icon-xs lb-search-ico" alt="" />
          <input
            type="search"
            id="lb-search-input"
            class="lb-search-control"
            placeholder="بحث بالاسم أو الفرع..."
            aria-label="البحث في قائمة الترتيب"
          />
        </div>
      </div>
    </header>

    <!-- TOP 3 CARDS GRID (Fish.Audio Style: 3 Equal-Height Horizontal Cards) -->
    <section class="top-cards-section" aria-label="أبطال التميز الميداني">
      <div class="top-cards-grid" id="top-cards-mount">
        <!-- Rendered dynamically via leaderboard.page.js -->
      </div>
    </section>

    <!-- GENERAL RANKING LIST (Fish.Audio Style: Multi-Column Aligned Table) -->
    <section class="ranking-table-section" aria-label="جدول الترتيب العام">
      <div class="ranking-table-card">
        <!-- Table Column Header (Hidden on small mobile, visible tablet/desktop) -->
        <div class="ranking-table-head">
          <div class="col-rank">الترتيب</div>
          <div class="col-user">المنسق الميداني</div>
          <div class="col-stat">إجمالي النقاط</div>
          <div class="col-stat">الأنشطة المقبولة</div>
          <div class="col-stat">الجولات المكتملة</div>
          <div class="col-stat">معدل الجودة</div>
        </div>

        <!-- Rows Container -->
        <div id="leaderboard-list" class="ranking-table-body">
          <!-- Rendered dynamically via leaderboard.page.js -->
        </div>
      </div>
    </section>
  </main>

  <script src="../js/config/env.config.js"></script>
  <script src="../js/utils/formatters.js"></script>
  <script src="../js/ui-helpers.js"></script>
  <script src="../js/store/employee-registry.seed.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/config/adco-catalogs.config.js"></script>
  <script src="../js/store/seed-data.js"></script>
  <script src="../js/store/activity.store.js"></script>
  <script src="../js/services/branch.service.js"></script>
  <script src="../js/utils/gps-proximity.util.js"></script>
  <script src="../js/utils/score.util.js"></script>
  <script src="../js/utils/brand-share.util.js"></script>
  <script src="../js/services/activity-submission.service.js"></script>
  <script src="../js/services/activity-lifecycle.service.js"></script>
  <script src="../js/activity-manager.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/leaderboard.page.js"></script>
</body>
</html>
